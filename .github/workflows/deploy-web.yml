name: Deploy web demo

# Publishes the browser demo of TFI to GitHub Pages.
# The shipped product is the iOS/Android app; this is a preview so people can
# try the game from a link. Set Settings → Pages → Source to "GitHub Actions"
# for this workflow to be allowed to deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Don't publish a build that doesn't pass the same checks we run locally.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build:web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
